<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24322c">
  <title>更新路书｜自驾青甘</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f4f1e9;color:#183027;font-family:system-ui,sans-serif;padding:24px}main{width:100%;max-width:420px;padding:28px;background:#fffdf8;border:1px solid #ded9ce;border-radius:18px}h1{font-family:"Songti SC",serif;font-size:28px;margin:0 0 18px}p{font-size:16px;line-height:1.7}button{width:100%;padding:16px;border:0;border-radius:10px;background:#123f32;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6}a{color:#123f32}#status{min-height:48px;color:#717972}
  </style>
</head>
<body><main>
  <h1>自驾青甘</h1>
  <p>更新网页到最新版本。待办、旅记和照片保留在当前浏览器，不会删除。</p>
  <button id="update">更新页面，保留记录</button>
  <p id="status" role="status" aria-live="polite">请保持联网。</p>
  <a href="./">返回路书</a>
</main>
<script>
  const button = document.getElementById('update');
  const status = document.getElementById('status');
  button.addEventListener('click', async () => {
    button.disabled = true;
    status.textContent = '正在获取新版页面…';
    try {
      const base = new URL('./', location.href);
      const target = new URL('index.html', base);
      target.searchParams.set('updated', Date.now().toString());
      const response = await fetch(target.href, { cache: 'no-store' });
      if (!response.ok || !(await response.text()).includes('2026 自驾青甘')) throw new Error('新版页面尚未获取成功，请稍后重试。');
      // Only reset this roadbook's static cache and registration. Never touch
      // localStorage, IndexedDB, cookies, photos, journal entries or todos.
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.filter(item => item.scope === base.href).map(item => item.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(key => key.startsWith('qinggan-pages-')).map(key => caches.delete(key)));
      }
      status.textContent = '已更新，正在打开路书…';
      location.replace(target.href);
    } catch (error) {
      status.textContent = error.message || '更新失败，请检查网络后重试。';
      button.disabled = false;
    }
  });
</script>
</body></html>
